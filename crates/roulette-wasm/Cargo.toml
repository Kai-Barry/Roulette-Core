[package]
name = "roulette-wasm"
version = "2.0.0"
edition = "2021"
description = "wasm-bindgen facade over the roulette-core headless engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
roulette-core = { path = "../roulette-core" }
roulette-content = { path = "../roulette-content" }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Forward the telemetry side channel to JS (REQ-008).
# Default on: node + web bundles must match (renderer reads spin_telemetry).
default = ["telemetry"]
telemetry = ["roulette-core/telemetry"]

[package.metadata.wasm-pack.profile.release]
# wasm-opt runs by default; keep size sane but don't strip telemetry exports.

[dev-dependencies]
wasm-bindgen-test = "0.3"