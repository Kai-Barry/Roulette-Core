[workspace]
resolver = "2"
members = [
    "crates/roulette-content",
    "crates/roulette-core",
    "crates/roulette-cli",
    "crates/roulette-sim",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
authors = ["Kai-Barry"]
license = "All rights reserved"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
